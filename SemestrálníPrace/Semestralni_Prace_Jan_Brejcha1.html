<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SemestralniPrace</title>
    <link rel="stylesheet" href="Semestralni_Prace_Jan_Brejcha1.css">
</head>
<body>

    <header class="Horni-cast">
        <div class="Nadpis">
            <h1>Název webu</h1> 
        </div>
        <hr>
        <nav class="Kategorie">
            <div class="Kategorie-polozka">Elektronika</div>
            <div class="Kategorie-polozka">Vozidla</div>
            <div class="Kategorie-polozka">Oblečení</div>
            <div class="Kategorie-polozka">Zvířata</div>
            <div class="Kategorie-polozka">Sport</div>
            <div class="Kategorie-polozka">Služby</div>
        </nav>
    </header>

    <main class="Obsah"> 
        <section class="Vyhledavani">
            <h1>Rychlé Vyhledávání</h1>
            <form class="Vyhledavac-bublina">
                <input type="text" placeholder="Co hledáte? Např. iPhone, auto, kolo...">
                <button type="submit">Hledat</button>
            </form>
        </section>

        <section class="Filtr">
            <h2>Filtr:</h2>
            <form class="Filtr-bubliny">
                <div class="Filtr-bublina">
                    <label for="filtr-psc" class="Filtr-nadpis">PSČ</label>
                    <input type="text" id="filtr-psc" placeholder="Např. 301 00" maxlength="6">
                </div>

                <div class="Filtr-bublina">
                    <span class="Filtr-nadpis">CENA (KČ)</span>
                    <div class="Cena-rozsah">
                        <input type="number" placeholder="Od" min="0">
                        <span>–</span>
                        <input type="number" placeholder="Do" min="0">
                    </div>
                </div>

                <div class="Filtr-bublina">
                    <label for="filtr-typ" class="Filtr-nadpis">TYP PRODUKTU</label>
                    <select id="filtr-typ">
                        <option value="vse">Všechny kategorie</option>
                        <option value="elektronika">Elektronika</option>
                        <option value="vozidla">Vozidla</option>
                        <option value="obleceni">Oblečení</option>
                        <option value="zvirata">Zvířata</option>
                        <option value="sport">Sport</option>
                        <option value="sluzby">Služby</option>
                    </select>
                </div>

                <div class="Filtr-bublina">
                    <label for="filtr-stav" class="Filtr-nadpis">STAV</label>
                    <select id="filtr-stav">
                        <option value="vse">Jakýkoliv</option>
                        <option value="nove">Nové</option>
                        <option value="pouzite">Použité</option>
                    </select>
                </div>

                <div class="Filtr-bublina">
                    <label for="filtr-okoli" class="Filtr-nadpis">OKOLÍ</label>
                    <select id="filtr-okoli">
                        <option value="0">Celá ČR</option>
                        <option value="5">+ 5 km</option>
                        <option value="15">+ 15 km</option>
                        <option value="30">+ 30 km</option>
                        <option value="50">+ 50 km</option>
                    </select>
                </div>

                <button type="submit" class="Filtr-tlacitko">Filtrovat</button>
            </form>
        </section>
    </main>

</body>
</html>
